<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beep Me</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --accent: #38bdf8;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      background: var(--panel);
      padding: 2rem 2.5rem;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      width: min(92vw, 420px);
      text-align: center;
    }
    h1 {
      margin: 0 0 0.25rem;
      font-size: 1.5rem;
      letter-spacing: 0.02em;
    }
    .clock {
      font-size: 2.75rem;
      font-variant-numeric: tabular-nums;
      margin: 1rem 0 1.5rem;
      color: var(--accent);
      font-weight: 600;
    }
    .inputs {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .field { display: flex; flex-direction: column; }
    .field label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    .field input {
      width: 70px;
      padding: 0.6rem;
      font-size: 1.5rem;
      text-align: center;
      border: 1px solid #334155;
      border-radius: 10px;
      background: #0f172a;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .field input:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
    .colon { font-size: 1.5rem; padding-bottom: 0.65rem; color: var(--muted); }
    button {
      width: 100%;
      padding: 0.85rem;
      font-size: 1.05rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: var(--accent);
      color: #06283d;
      transition: filter 0.15s ease;
    }
    button:hover { filter: brightness(1.08); }
    button.cancel { background: #ef4444; color: #fff; }
    .voice {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
      font-size: 0.95rem;
      color: var(--muted);
      cursor: pointer;
    }
    .voice input { width: 1.1rem; height: 1.1rem; accent-color: var(--accent); }
    .status {
      margin-top: 1rem;
      min-height: 1.25rem;
      font-size: 0.95rem;
      color: var(--muted);
    }
    .status.active { color: var(--accent); }
    .status.ringing { color: #fbbf24; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <h1>⏰ Beep Me</h1>
    <div class="clock" id="clock">--:--:--</div>

    <div class="inputs">
      <div class="field">
        <label for="hh">Hour</label>
        <input id="hh" type="number" min="0" max="23" value="07" />
      </div>
      <span class="colon">:</span>
      <div class="field">
        <label for="mm">Min</label>
        <input id="mm" type="number" min="0" max="59" value="00" />
      </div>
      <span class="colon">:</span>
      <div class="field">
        <label for="ss">Sec</label>
        <input id="ss" type="number" min="0" max="59" value="00" />
      </div>
    </div>

    <label class="voice"><input id="voice" type="checkbox" /> Voice countdown</label>

    <button id="toggle">Set Alarm</button>
    <div class="status" id="status">No alarm set</div>
  </div>

  <script>
    const clockEl = document.getElementById('clock');
    const statusEl = document.getElementById('status');
    const toggleBtn = document.getElementById('toggle');
    const hh = document.getElementById('hh');
    const mm = document.getElementById('mm');
    const ss = document.getElementById('ss');
    const voiceCb = document.getElementById('voice');

    let alarmSet = false;
    let targetH, targetM, targetS;
    // Countdown cues, keyed by seconds remaining: number of short beeps, or
    // 'tone' for the 1-second tone at the set time.
    const CUES = { 30: 3, 20: 2, 10: 1, 0: 'tone' };
    // Extra spoken-only cues when "Voice countdown" is checked.
    const VOICE_COUNTDOWN = [5, 4, 3, 2, 1];
    let firedCues = new Set(); // guard against firing a cue twice

    const pad = (n) => String(n).padStart(2, '0');

    function tick() {
      const now = new Date();
      const h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
      clockEl.textContent = `${pad(h)}:${pad(m)}:${pad(s)}`;

      if (!alarmSet) return;

      // Seconds until the alarm, wrapping past midnight.
      const nowSec = h * 3600 + m * 60 + s;
      const targetSec = targetH * 3600 + targetM * 60 + targetS;
      const remaining = (targetSec - nowSec + 86400) % 86400;

      if (firedCues.has(remaining)) return;
      const voice = voiceCb.checked;

      if (remaining in CUES) {
        firedCues.add(remaining);
        if (remaining === 0) {
          if (voice) speak('zero');
          triggerAlarm();
        } else {
          const count = CUES[remaining];
          beep(count);
          // Speak after the beeps finish so they don't talk over each other.
          if (voice) setTimeout(() => speak(`${remaining} seconds`), count * 250 + 100);
          statusEl.textContent = `⏳ ${remaining} seconds…`;
        }
      } else if (voice && VOICE_COUNTDOWN.includes(remaining)) {
        firedCues.add(remaining);
        speak(String(remaining));
        statusEl.textContent = `⏳ ${remaining}…`;
      }
    }

    // Speak `text` with the browser's built-in speech synthesis. Cancels any
    // queued speech first so a slow voice never falls behind the clock.
    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      try {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.rate = 1.1;
        speechSynthesis.speak(u);
      } catch (e) {
        console.error('Speech failed:', e);
      }
    }

    // iOS only allows speech after it has been started from a user gesture;
    // speaking an empty utterance on the Set Alarm tap unlocks it.
    function unlockSpeech() {
      if (!('speechSynthesis' in window)) return;
      try { speechSynthesis.speak(new SpeechSynthesisUtterance('')); } catch (e) { /* ignore */ }
    }

    function triggerAlarm() {
      tone(1.0);
      alarmSet = false; // auto turn off after the final tone
      statusEl.textContent = '🔔 Alarm! Time reached — turned off.';
      statusEl.className = 'status ringing';
      toggleBtn.textContent = 'Set Alarm';
      toggleBtn.classList.remove('cancel');
    }

    // One persistent AudioContext, reused for every beep. Creating a fresh
    // context per alarm is unreliable on mobile (Android/iOS): a new context
    // starts suspended and takes ~100-200ms to actually run, so events
    // scheduled at currentTime get dropped or clipped — which drops the first
    // beep and cuts off the next. Reusing a context unlocked on a user gesture
    // avoids that.
    let audioCtx = null;

    function getCtx() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioCtx;
    }

    // Resume the shared context. Call on a user gesture (Set Alarm tap) so the
    // browser permits audio later, and again just before beeping.
    function unlockAudio() {
      try {
        const ctx = getCtx();
        if (ctx.state === 'suspended') return ctx.resume();
      } catch (e) { /* ignore */ }
      return Promise.resolve();
    }

    // `count` short beeps in rapid succession (countdown warnings).
    function beep(count) {
      playSequence(count, 0.15);
    }

    // A single sustained tone of `seconds` length (the alarm itself).
    function tone(seconds) {
      playSequence(1, seconds);
    }

    // Play `count` tones of `dur` seconds each using the Web Audio API.
    function playSequence(count, dur) {
      const ctx = getCtx();

      const playTones = () => {
        const gap = 0.1;     // silence between beeps
        const lead = 0.08;   // headroom so the context is running before beep 1
        const fade = 0.02;   // attack/release to avoid clicks
        for (let i = 0; i < count; i++) {
          const start = ctx.currentTime + lead + i * (dur + gap);
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = 880;
          osc.connect(gain);
          gain.connect(ctx.destination);
          gain.gain.setValueAtTime(0.0001, start);
          gain.gain.exponentialRampToValueAtTime(1.0, start + fade); // full level; user controls loudness via device volume
          gain.gain.setValueAtTime(1.0, start + Math.max(fade, dur - 0.1));
          gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
          osc.start(start);
          osc.stop(start + dur + 0.05);
        }
      };

      // The context may have been suspended while the tab was idle; resume
      // first, then schedule once it is actually running so nothing is clipped.
      try {
        if (ctx.state === 'suspended') {
          ctx.resume().then(playTones).catch(playTones);
        } else {
          playTones();
        }
      } catch (e) {
        console.error('Beep failed:', e);
      }
    }

    function setAlarm() {
      const h = parseInt(hh.value, 10);
      const m = parseInt(mm.value, 10);
      const s = parseInt(ss.value, 10);

      if ([h, m, s].some(Number.isNaN) ||
          h < 0 || h > 23 || m < 0 || m > 59 || s < 0 || s > 59) {
        statusEl.textContent = 'Please enter a valid time.';
        statusEl.className = 'status';
        return;
      }

      // Unlock the shared audio context on this user gesture so the beep is
      // allowed to play later (required by mobile browsers).
      unlockAudio();
      if (voiceCb.checked) unlockSpeech();

      targetH = h; targetM = m; targetS = s;
      hh.value = pad(h); mm.value = pad(m); ss.value = pad(s);
      alarmSet = true;
      firedCues = new Set();
      statusEl.textContent = `Alarm set for ${pad(h)}:${pad(m)}:${pad(s)}`;
      statusEl.className = 'status active';
      toggleBtn.textContent = 'Cancel Alarm';
      toggleBtn.classList.add('cancel');
    }

    function cancelAlarm() {
      alarmSet = false;
      if ('speechSynthesis' in window) speechSynthesis.cancel();
      statusEl.textContent = 'Alarm canceled';
      statusEl.className = 'status';
      toggleBtn.textContent = 'Set Alarm';
      toggleBtn.classList.remove('cancel');
    }

    toggleBtn.addEventListener('click', () => {
      if (alarmSet) cancelAlarm();
      else setAlarm();
    });

    // Remember the voice checkbox between visits.
    try { voiceCb.checked = localStorage.getItem('beepMeVoice') === '1'; } catch (e) { /* ignore */ }
    voiceCb.addEventListener('change', () => {
      try { localStorage.setItem('beepMeVoice', voiceCb.checked ? '1' : '0'); } catch (e) { /* ignore */ }
      if (voiceCb.checked) unlockSpeech();
    });

    // Default the inputs to the current time on load.
    (function initToNow() {
      const now = new Date();
      hh.value = pad(now.getHours());
      mm.value = pad(now.getMinutes());
      ss.value = pad(now.getSeconds());
    })();

    tick();
    setInterval(tick, 250);
  </script>
</body>
</html>
